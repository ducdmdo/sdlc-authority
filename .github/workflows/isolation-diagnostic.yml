name: Isolation Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  bubblewrap:
    name: bubblewrap-isolation
    if: >-
      github.repository == 'ducdmdo/sdlc-authority' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout protected authority metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Provision reviewed isolation dependency
        shell: bash
        run: |
          set -euo pipefail
          package_log="$RUNNER_TEMP/isolation-package.log"
          cleanup() {
            rm -f "$package_log"
          }
          trap cleanup EXIT
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update >"$package_log" 2>&1
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap=0.9.0-1ubuntu0.1 >>"$package_log" 2>&1
          installed_version="$(
            dpkg-query --show --showformat='${Version}' bubblewrap
          )"
          test "$installed_version" = "0.9.0-1ubuntu0.1"
          test "$(command -v bwrap)" = "/usr/bin/bwrap"
          test "$(/usr/bin/bwrap --version)" = "bubblewrap 0.9.0"
          sudo --non-interactive true
      - name: Prove Bubblewrap isolation
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$probe_dir"
          }
          trap cleanup EXIT
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'test -r /workspace/probe' \
            > "$probe_dir/verify"
          printf '%s\n' 'runner-owned-bind-probe' > "$probe_dir/probe"
          chmod 0755 "$probe_dir/verify"
          test "$(stat -c '%a' "$probe_dir")" = "700"
          sudo chgrp 0 "$probe_dir"
          chmod 0750 "$probe_dir"
          sudo --non-interactive /usr/bin/bwrap \
            --unshare-all \
            --unshare-net \
            --die-with-parent \
            --new-session \
            --ro-bind "$probe_dir" /workspace \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind-try /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --chdir /workspace \
            --setenv HOME /tmp \
            --setenv PATH /usr/bin:/bin \
            /workspace/verify
